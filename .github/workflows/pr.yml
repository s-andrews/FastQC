name: PR

on:
  push:
    branches:
      - master # Run on pushes to the master branch
  pull_request:
    branches:
      - master # Run on pull requests targeting the master branch
  workflow_dispatch: # Allow manual triggering of the workflow

# Cancel existing executions when new commits are pushed onto the branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  run-tests:
    name: Run unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Test with Ant
        run: |
          java --version
          ant -version
          ant \
            clean \
            build \
            unit-test \
            integration-test

      - name: Test lib-rapidgzip
        working-directory: lib-rapidgzip
        run: ./gradlew test --console=plain

      - name: Upload test reports
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: |
            test/reports/TEST-*.xml
            lib-rapidgzip/build/test-results/test/TEST-*.xml
          include_passed: true
          detailed_summary: true
          check_title_template: '{{SUITE_NAME}} | {{TEST_NAME}}'

      - name: Upload received approval files
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: received-approval-files
          path: test/**/*.received.*
          retention-days: 30
